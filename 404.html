<script>
(function(){
  var yr=document.getElementById('yr'); if(yr) yr.textContent=new Date().getFullYear();
  var nav=document.querySelector('.nav');
  addEventListener('scroll',function(){nav.classList.toggle('scrolled',scrollY>8)},{passive:true});
  var ul=document.querySelector('.nav ul');
  function edge(){var o=ul.scrollWidth-ul.clientWidth;
    ul.classList.toggle('scrollable',o>2); ul.classList.toggle('at-end',ul.scrollLeft>=o-2);}
  if(ul){edge();ul.addEventListener('scroll',edge,{passive:true});addEventListener('resize',edge,{passive:true});
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(edge);}
})();
</script>
